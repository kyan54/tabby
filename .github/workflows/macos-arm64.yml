name: macOS arm64 artifacts

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/macos-arm64.yml, release-version.json]

permissions:
  contents: read

concurrency:
  group: macos-arm64-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      release_requested: ${{ steps.release.outputs.requested }}
    env:
      ARCH: arm64
      RUST_TARGET_TRIPLE: aarch64-apple-darwin
      REV: ${{ github.run_id }}
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      HAS_MAC_NOTARIZATION: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPSTORE_USERNAME != '' && secrets.APPSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Resolve explicit release request
        id: release
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node - <<'JS'
          const fs = require('fs')
          const metadata = require('./release-version.json')
          const requested = process.env.GITHUB_REF === 'refs/heads/master' &&
            (process.env.RELEASE_MESSAGE || '').includes(`[release:${metadata.tag}]`)
          if (!/^\d+\.\d+\.\d+(?:-fix)?$/.test(metadata.version) || ![`v${metadata.version}`, `macos-v${metadata.version}`].includes(metadata.tag)) throw Error('Invalid release identity')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `requested=${requested}\n`)
          if (requested) fs.appendFileSync(process.env.GITHUB_ENV, `TABBY_RELEASE_VERSION=${metadata.version}\n`)
          JS
      - name: Require existing signing and notarization credentials
        run: |
          test "$HAS_MAC_SIGNING" = true
          test "$HAS_MAC_NOTARIZATION" = true
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin
      - name: Install dependencies and rebuild native modules
        run: |
          corepack enable
          yarn --frozen-lockfile --network-timeout 1000000
      - name: Test, lint and build sources
        run: |
          yarn run test:ssh-term
          yarn run test:unit
          node --test scripts/test/macos-release.test.cjs
          yarn run build:typings
          yarn run lint
          yarn run build
      - name: Prepackage plugins
        run: node scripts/prepackage-plugins.mjs
      - name: Prepare Electron packaging
        run: |
          sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js
          ln -s ../../node_modules/electron app/node_modules/electron
      - name: Build signed packages with existing credentials
        if: env.HAS_MAC_SIGNING == 'true'
        run: node scripts/build-macos.mjs
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.HAS_MAC_NOTARIZATION == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPSTORE_USERNAME: ${{ secrets.APPSTORE_USERNAME }}
          APPSTORE_PASSWORD: ${{ secrets.APPSTORE_PASSWORD }}
          USE_HARD_LINKS: false
      - name: Verify packages and record provenance
        run: |
          APP=dist/mac-arm64/Tabby.app
          test "$(lipo -archs "$APP/Contents/MacOS/Tabby")" = arm64
          hdiutil verify dist/*.dmg
          unzip -tq dist/*.zip
          if [[ "$HAS_MAC_SIGNING" == true ]]; then
            codesign --verify --deep --strict "$APP"
          fi
          codesign -dv --verbose=2 "$APP" > dist/SIGNATURE_INFO.txt 2>&1 || true
          if [[ "$HAS_MAC_SIGNING" == true && "$HAS_MAC_NOTARIZATION" == true ]]; then
            xcrun stapler validate "$APP" >> dist/SIGNATURE_INFO.txt 2>&1
            spctl --assess --type execute --verbose=2 "$APP" >> dist/SIGNATURE_INFO.txt 2>&1
          fi
          shasum -a 256 dist/*.dmg | sed 's|dist/||' > dist/SHA256SUMS-dmg.txt
          shasum -a 256 dist/*.zip | sed 's|dist/||' > dist/SHA256SUMS-zip.txt
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          root = pathlib.Path('dist')
          app = root / 'mac-arm64/Tabby.app'
          with (app / 'Contents/Info.plist').open('rb') as f:
              info = plistlib.load(f)
          manifest = {
              'commit': os.environ['GITHUB_SHA'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'architecture': 'arm64',
              'version': info['CFBundleShortVersionString'],
              'developer_id_signing_requested': os.environ['HAS_MAC_SIGNING'] == 'true',
              'notarization_requested': os.environ['HAS_MAC_SIGNING'] == 'true' and os.environ['HAS_MAC_NOTARIZATION'] == 'true',
              'files': [{'name': p.name, 'bytes': p.stat().st_size} for pattern in ('*.dmg', '*.zip') for p in root.glob(pattern)],
          }
          (root / 'BUILD_INFO.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
          cat dist/SHA256SUMS-dmg.txt dist/SHA256SUMS-zip.txt
          cat dist/SIGNATURE_INFO.txt
      - name: Upload arm64 DMG and verification
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-macOS-arm64-dmg-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.dmg
            dist/SHA256SUMS-dmg.txt
            dist/BUILD_INFO.json
            dist/SIGNATURE_INFO.txt
      - name: Upload arm64 ZIP and verification
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-macOS-arm64-zip-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.zip
            dist/SHA256SUMS-zip.txt
            dist/BUILD_INFO.json
            dist/SIGNATURE_INFO.txt

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.release_requested == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Tabby-macOS-arm64-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Publish verified arm64 assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const { publish } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/publish-macos-release.cjs'))
            await publish({ github, context, core,
              directory: path.join(process.env.GITHUB_WORKSPACE, 'release-assets'),
              metadata: require(path.join(process.env.GITHUB_WORKSPACE, 'release-version.json')),
              notes: fs.readFileSync('docs/release-macos.md', 'utf8') })
